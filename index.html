<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>V8 Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#060912;color:#e8eef5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain;min-height:100vh}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
#root{min-height:100vh;position:relative;z-index:1}

/* Ambient glow di sfondo */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
body::before{width:480px;height:480px;background:rgba(64,164,255,.18);top:-200px;left:-100px}
body::after{width:520px;height:520px;background:rgba(170,80,255,.14);bottom:-200px;right:-150px}
.amb-green{position:fixed;width:380px;height:380px;border-radius:50%;background:rgba(80,255,170,.12);filter:blur(120px);top:40%;left:30%;pointer-events:none;z-index:0}

/* Glassmorphism */
.glass{background:rgba(20,28,45,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.07);border-radius:16px}
.glass-strong{background:rgba(20,28,45,.75);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.10);border-radius:16px}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;color:inherit;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(64,164,255,.55);background:rgba(64,164,255,.08)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* Animazioni */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDownModal{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(64,164,255,.45)}50%{box-shadow:0 0 0 12px rgba(64,164,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.fadeIn{animation:fadeIn .35s ease}
.slideUp{animation:slideUp .35s ease}
.slideDown{animation:slideDownModal .25s ease}
.pulse{animation:pulseGlow 1.6s ease infinite}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(6,9,18,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:17px;font-weight:700;margin:0;flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);transition:background .2s}
.icon-btn:active{background:rgba(255,255,255,.12)}

/* Bottom nav */
.botnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(8,12,22,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:#7d8aa3;font-size:10px;font-weight:600;transition:color .2s}
.nav-item.active{color:#40c4ff}
.nav-item svg{width:22px;height:22px}

/* Tecnica badge */
.tech-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tech-badge:active{transform:scale(.92)}
.tech-A{background:linear-gradient(135deg,rgba(80,200,255,.20),rgba(80,200,255,.10));color:#7fd9ff;border:1px solid rgba(80,200,255,.35)}
.tech-B{background:linear-gradient(135deg,rgba(255,170,90,.22),rgba(255,170,90,.10));color:#ffc89e;border:1px solid rgba(255,170,90,.40)}
.tech-C{background:linear-gradient(135deg,rgba(255,90,140,.22),rgba(255,90,140,.10));color:#ff9eb4;border:1px solid rgba(255,90,140,.40)}
.tech-rir{background:rgba(170,170,200,.14);color:#c0c8d8;border:1px solid rgba(170,170,200,.25)}
.tech-amrap{background:linear-gradient(135deg,rgba(255,80,80,.25),rgba(255,80,80,.12));color:#ff9d9d;border:1px solid rgba(255,80,80,.45)}
.tech-rest{background:rgba(110,225,170,.16);color:#9ee9c5;border:1px solid rgba(110,225,170,.28)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
.modal{background:linear-gradient(180deg,#1a2238 0%,#101626 100%);border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:slideDownModal .3s cubic-bezier(.2,.8,.3,1) reverse;padding:0}
.modal-handle{width:42px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin:10px auto 4px}
.modal-header{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.modal-body{padding:16px 18px 24px}

/* Set row Hevy-style */
.set-row{display:grid;grid-template-columns:48px 1fr 90px 90px 48px;align-items:center;padding:14px 8px;gap:8px;border-radius:12px;transition:background .2s}
.set-row.completed{background:rgba(80,200,140,.10);border:1px solid rgba(80,200,140,.20)}
.set-row.active{background:rgba(64,164,255,.08);border:1px solid rgba(64,164,255,.18)}
.set-num{font-weight:700;font-size:18px;text-align:center;color:#9aa6bd}
.set-row.completed .set-num{color:#7fe2b0}
.set-prev{font-size:12px;color:#7d8aa3;text-align:center}
.set-target{font-size:14px;font-weight:600;color:#c8d0e0;text-align:center}
.set-check{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);transition:all .2s}
.set-check.done{background:#22c069;border-color:#22c069;box-shadow:0 0 14px rgba(34,192,105,.45)}

/* Hero exercise card */
.exercise-hero{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:18px;overflow:hidden;display:flex;gap:14px;padding:14px;margin-bottom:14px;transition:transform .15s}
.exercise-hero:active{transform:scale(.99)}
.exercise-thumb{width:88px;height:88px;border-radius:12px;background:#fff;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.exercise-thumb img{width:100%;height:100%;object-fit:contain}
.exercise-meta{flex:1;min-width:0}
.exercise-meta h3{margin:0 0 4px;font-size:15.5px;font-weight:700;line-height:1.25}
.exercise-meta .muscles{font-size:11.5px;color:#7d8aa3;margin-bottom:7px}
.exercise-meta .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}

/* Workout exercise (tap to expand to detail) */
.wex-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;margin-bottom:14px;animation:fadeIn .35s ease}
.wex-head{display:flex;gap:12px;padding:12px;cursor:pointer;align-items:flex-start}
.wex-thumb{width:64px;height:64px;border-radius:10px;background:#fff;flex-shrink:0;overflow:hidden}
.wex-thumb img{width:100%;height:100%;object-fit:contain}
.wex-info{flex:1;min-width:0}
.wex-info h4{margin:0 0 3px;font-size:14.5px;font-weight:700;line-height:1.25}
.wex-info .sub{font-size:11px;color:#8b97ad;margin-bottom:6px}
.wex-info .badges{display:flex;flex-wrap:wrap;gap:4px}

/* Load lock (peso "una volta per tutte") */
.load-lock{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 12px 8px;background:linear-gradient(90deg,rgba(64,164,255,.12),rgba(64,164,255,.04));border:1px solid rgba(64,164,255,.25);border-radius:12px}
.load-lock label{font-size:11px;font-weight:700;letter-spacing:.5px;color:#7fd9ff;text-transform:uppercase}
.load-lock input{flex:1;text-align:center;font-size:18px;font-weight:700;background:rgba(0,0,0,.2);border:1px solid rgba(64,164,255,.30);padding:8px}
.load-lock .unit{font-size:13px;color:#7fd9ff;font-weight:700}

/* Floating timer */
.timer-fab{position:fixed;right:16px;top:64px;z-index:100;background:linear-gradient(135deg,#22c069,#16915a);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1) inset;font-weight:700;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;animation:slideDownModal .3s ease}
.timer-fab.warn{background:linear-gradient(135deg,#ffaa3d,#e07a1a);animation:pulseGlow 1.2s ease infinite}
.timer-fab .t-time{font-size:18px}
.timer-fab .t-actions{display:flex;gap:5px;margin-left:6px}
.timer-fab .t-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#fff}
.timer-expanded{position:fixed;left:16px;right:16px;top:64px;z-index:100;background:linear-gradient(135deg,#1a4a2f,#0f2a1c);border:1px solid rgba(80,255,170,.4);border-radius:18px;padding:18px;box-shadow:0 20px 48px rgba(0,0,0,.7);animation:slideUp .3s ease}
.timer-expanded .t-big{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:#7fe2b0;text-shadow:0 0 24px rgba(80,255,170,.45);margin:6px 0}
.timer-expanded.warn{background:linear-gradient(135deg,#5a2e0a,#2a1605);border-color:rgba(255,170,60,.5)}
.timer-expanded.warn .t-big{color:#ffc89e;text-shadow:0 0 24px rgba(255,170,60,.5)}
.timer-expanded .t-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.timer-expanded .t-row button{flex:1;max-width:120px;padding:10px;border-radius:10px;background:rgba(255,255,255,.10);font-weight:700;font-size:13px;color:#fff}
.timer-expanded .t-row button.primary{background:rgba(80,255,170,.18);color:#7fe2b0;border:1px solid rgba(80,255,170,.3)}

/* Dashboard cards */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.kpi{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.kpi .lbl{font-size:10.5px;color:#7d8aa3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:700}
.kpi .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:#8b97ad;margin-top:3px}

/* Step list (esecuzione esercizio) */
.steps-list{counter-reset:step;list-style:none;padding:0;margin:14px 0}
.steps-list li{counter-increment:step;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;line-height:1.5}
.steps-list li::before{content:counter(step);min-width:26px;height:26px;border-radius:50%;background:rgba(64,164,255,.16);color:#7fd9ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0}

/* Cue box */
.cue-box{background:linear-gradient(135deg,rgba(255,170,60,.14),rgba(255,170,60,.04));border:1px solid rgba(255,170,60,.3);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.cue-box .ico{font-size:20px;flex-shrink:0}
.cue-box p{margin:0;font-size:13.5px;line-height:1.5;color:#ffd9b3}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,30,50,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:300;animation:fadeIn .3s ease;box-shadow:0 12px 36px rgba(0,0,0,.5)}

/* Settimana selector */
.week-pills{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.week-pills::-webkit-scrollbar{display:none}
.week-pill{flex-shrink:0;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.05);font-size:12px;font-weight:700;color:#9aa6bd;white-space:nowrap;transition:all .2s}
.week-pill.active{background:linear-gradient(135deg,#40a4ff,#7059ff);color:#fff;box-shadow:0 6px 16px rgba(64,164,255,.35)}
.week-pill .blk{font-size:9px;opacity:.85;display:block;letter-spacing:.5px}

/* Day pills */
.day-tabs{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.04);border-radius:12px;margin:0 12px 12px}
.day-tab{flex:1;padding:9px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:#9aa6bd;text-align:center;transition:all .2s}
.day-tab.active{background:rgba(64,164,255,.18);color:#7fd9ff}

.section-h{font-size:13px;font-weight:700;color:#9aa6bd;text-transform:uppercase;letter-spacing:1px;margin:18px 12px 8px;display:flex;align-items:center;gap:8px}

.empty-state{text-align:center;padding:40px 20px;color:#7d8aa3}
.empty-state .ico{font-size:48px;margin-bottom:12px;opacity:.5}

/* Settings */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin:8px 0;font-size:14px}
.btn-primary{display:block;width:100%;padding:13px;background:linear-gradient(135deg,#40a4ff,#7059ff);border-radius:12px;font-weight:700;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(64,164,255,.30)}
.btn-secondary{display:block;width:100%;padding:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:12px;font-weight:700;color:#e8eef5;text-align:center}
.btn-danger{display:block;width:100%;padding:13px;background:rgba(255,80,80,.14);border:1px solid rgba(255,80,80,.35);border-radius:12px;font-weight:700;color:#ff9d9d;text-align:center}

.muted{color:#7d8aa3}
.tiny{font-size:11px}
hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:14px 0}
</style>
</head>
<body>
<div class="amb-green"></div>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useContext, createContext, useMemo} = React;

// ═══════════════════════════════════════════════════════════════════
// COSTANTI E DATI PROGRAMMA V8 BLOCK CUTTING — 8 settimane, 100kg, IF 16:8
// ═══════════════════════════════════════════════════════════════════

const PROGRAM_NAME = "V8 Block Cutting";
const PROGRAM_WEEKS = 8;
const ATHLETE_WEIGHT = 100;

const DAYS = [
  {id:"lun", label:"LUN", title:"PUSH", color:"#ff7066"},
  {id:"mar", label:"MAR", title:"PULL", color:"#40a4ff"},
  {id:"gio", label:"GIO", title:"LEGS", color:"#a872ff"},
  {id:"ven", label:"VEN", title:"UPPER", color:"#ffa83d"},
  {id:"sab", label:"SAB", title:"FULL", color:"#22c069"},
];

// Le tecniche: spiegazioni complete cliccabili da qualsiasi pagina
const TECNICHE = {
  "BlockA": {
    short: "Blocco A",
    color: "#7fd9ff",
    cls: "tech-A",
    title: "Blocco A — Accumulo (sett. 1-3)",
    desc: "Fase di costruzione del volume. RIR 2-3, reps 8-10. L'obiettivo è macinare set di qualità senza arrivare al cedimento. Forma pulita, tempo sotto tensione.",
    detail: [
      "RIR (Reps In Reserve) 2-3 = ferma il set quando senti che potresti farne altre 2-3 con buona forma",
      "Reps 8-10 sui compound, 10-12 sugli accessori",
      "Tempo: eccentrica 2-3s controllata, concentrica esplosiva ma sotto controllo",
      "Volume settimanale alto: 13-15 set per gruppo muscolare",
      "Recupero: 2-3 min compound, 90s accessori"
    ]
  },
  "BlockB": {
    short: "Blocco B",
    color: "#ffc89e",
    cls: "tech-B",
    title: "Blocco B — Intensificazione (sett. 4-6)",
    desc: "Aumento del peso e intensità. RIR 1-2, reps 6-8 sui compound. Volume leggermente ridotto. Più peso, meno set.",
    detail: [
      "RIR 1-2 = molto vicino al cedimento ma con margine di sicurezza",
      "Reps 6-8 compound, 8-10 accessori (carico ~+5% rispetto Blocco A)",
      "Volume calante: 11-13 set per gruppo muscolare (deload del volume)",
      "Recupero: 3-4 min compound (servono per pesi più alti), 2 min accessori",
      "Forma SEMPRE pulita: se il bilanciere si muove storto, fermati"
    ]
  },
  "BlockC": {
    short: "Blocco C",
    color: "#ff9eb4",
    cls: "tech-C",
    title: "Blocco C — Peak + AMRAP (sett. 7-8)",
    desc: "Picco di forza. RIR 0-1, reps 4-6 sui compound, AMRAP nelle ultime serie. Settimana 8 è il test finale.",
    detail: [
      "RIR 0-1 = tutto quello che hai, fermati solo se la forma cede",
      "Compound: 4-6 reps al ~85-90% del 1RM stimato",
      "AMRAP (As Many Reps As Possible) sulle ultime serie del compound principale",
      "Volume basso: 8-10 set per gruppo (peak intensity)",
      "Recupero: 4-5 min compound, 2-3 min accessori",
      "Sett. 8 ultimo workout: testa 1RM su squat/panca/stacco"
    ]
  },
  "RIR": {
    short: "RIR",
    color: "#c0c8d8",
    cls: "tech-rir",
    title: "RIR — Reps In Reserve",
    desc: "Quante ripetizioni potresti ancora fare con buona forma alla fine del set.",
    detail: [
      "RIR 0 = cedimento muscolare, non riesci a fare nemmeno una rep in più",
      "RIR 1 = potresti farne UNA in più",
      "RIR 2 = potresti farne 2 in più",
      "RIR 3 = potresti farne 3 in più",
      "Non confondere con RPE: RPE 10 = RIR 0, RPE 9 = RIR 1, ecc."
    ]
  },
  "AMRAP": {
    short: "AMRAP",
    color: "#ff9d9d",
    cls: "tech-amrap",
    title: "AMRAP — As Many Reps As Possible",
    desc: "Ultimo set portato al cedimento concentrico. Massimo numero di ripetizioni possibile mantenendo forma corretta.",
    detail: [
      "Si usa SOLO sull'ultimo set, mai sui set precedenti",
      "Stop quando la forma comincia a cedere (anche se potresti spingere ancora 1-2)",
      "Conta come stimolo massimo per ipertrofia + indicatore di progresso",
      "Tipico in Blocco C settimana 7-8 sui compound principali",
      "Sicurezza: usa fermi/spotter per panca, mai sopra la testa"
    ]
  },
  "REST3": {
    short: "Rec 3min",
    color: "#9ee9c5",
    cls: "tech-rest",
    title: "Recupero 3 minuti",
    desc: "Standard sui compound. Ricarica fosfocreatina, abbassa fatica neurale.",
    detail: [
      "Compound (squat/panca/stacco/military): 2-3 min Blocco A, 3-4 min Blocco B, 4-5 min Blocco C",
      "Accessori isolamento: 60-90s",
      "Macchine guidate: 90s-2min",
      "Cardio finisher: 30-60s tra round",
      "Se hai tempo limitato: superset antagonisti per ridurre rest senza perdere intensità"
    ]
  },
  "DProgr": {
    short: "Dbl Progr.",
    color: "#7fd9ff",
    cls: "tech-A",
    title: "Double Progression (Helms/Israetel)",
    desc: "Strategia per progredire con peso e reps. Quando raggiungi il top del rep range su tutti i set con buona forma, aumenta il peso.",
    detail: [
      "Esempio range 8-10 reps: parti con un peso che ti permetta 8 reps RIR 2 sul primo set",
      "Settimana dopo: prova a fare 9 reps, poi 10",
      "Quando fai 10 reps su tutti i set → aumenta il peso (+2.5kg compound, +1-2kg accessori)",
      "Riparti da 8 reps con il nuovo peso e ricomincia il ciclo",
      "Funziona sia in Blocco A (8-10) che B (6-8) — adatti il range"
    ]
  },
  "Eccent": {
    short: "Eccent. 3s",
    color: "#7fd9ff",
    cls: "tech-A",
    title: "Eccentrica controllata 3 secondi",
    desc: "Fase di discesa lenta e controllata, 3 secondi precisi. Massimizza tempo sotto tensione.",
    detail: [
      "Conta mentalmente: \"mille-uno, mille-due, mille-tre\" durante la discesa",

  BlockB: {sets:4, reps:"6-8", repsMin:6, repsMax:8, rest:240, restAcc:120, name:"Intensificaz."},

// STORAGE
// ═══════════════════════════════════════════════════════════════════

const KEY_PREFIX = "v8tracker_";
const storage = {
  get(k, fallback=null) {
    try { const v = localStorage.getItem(KEY_PREFIX+k); return v===null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(k, v) {
    try { localStorage.setItem(KEY_PREFIX+k, JSON.stringify(v)); } catch {}
  },
  remove(k) { try { localStorage.removeItem(KEY_PREFIX+k); } catch {} }
};

// ═══════════════════════════════════════════════════════════════════
// TIMER CONTEXT (persistente cross-screen)
// ═══════════════════════════════════════════════════════════════════

const TimerContext = createContext(null);

function TimerProvider({children}) {
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(false);
  const [startedAt, setStartedAt] = useState(null);
  const [duration, setDuration] = useState(180);
  const [label, setLabel] = useState("");
  const [collapsed, setCollapsed] = useState(false);
  const intRef = useRef(null);

  // Restore da localStorage
  useEffect(() => {
    const saved = storage.get("timer_state");
    if (saved && saved.startedAt && saved.duration) {
      const elapsed = Math.floor((Date.now() - saved.startedAt) / 1000);
      const left = saved.duration - elapsed;
      if (left > 0) {
        setStartedAt(saved.startedAt);
        setDuration(saved.duration);
        setSeconds(left);
        setLabel(saved.label || "");
        setRunning(true);
        setCollapsed(saved.collapsed || false);
      } else {
        storage.remove("timer_state");
      }
    }
  }, []);

  // Persist
  useEffect(() => {
    if (running && startedAt) {
      storage.set("timer_state", {startedAt, duration, label, collapsed});
    } else if (!running) {
      storage.remove("timer_state");
    }
  }, [running, startedAt, duration, label, collapsed]);

  // Tick
  useEffect(() => {
    if (running && startedAt) {
      intRef.current = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
        const left = duration - elapsed;
        if (left <= 0) {
          setSeconds(0);
          setRunning(false);
          setStartedAt(null);
          // Beep + vibrate
          try { if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]); } catch {}
          try { 
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 880; g.gain.value = 0.3;
            osc.start(); 
            setTimeout(()=>{osc.frequency.value=1320},150);
            setTimeout(()=>{osc.stop(); ctx.close()},400);
          } catch {}
        } else {
          setSeconds(left);
        }
      }, 250);
      return () => clearInterval(intRef.current);
    }
  }, [running, startedAt, duration]);

  const start = (dur, lbl="") => {
    setDuration(dur);
    setSeconds(dur);
    setStartedAt(Date.now());
    setLabel(lbl);
    setRunning(true);
    setCollapsed(false);
  };
  const stop = () => {
    setRunning(false);
    setStartedAt(null);
    setSeconds(0);
    storage.remove("timer_state");
  };
  const adjust = (delta) => {
    if (!running) return;
    const newDur = Math.max(5, duration + delta);
    setDuration(newDur);
    // Anche aggiorna seconds
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    setSeconds(Math.max(0, newDur - elapsed));
  };

  return (
    <TimerContext.Provider value={{seconds, running, label, duration, collapsed, setCollapsed, start, stop, adjust}}>
      {children}
    </TimerContext.Provider>
  );
}

const useTimer = () => useContext(TimerContext);

function FloatingTimer() {
  const {seconds, running, label, collapsed, setCollapsed, stop, adjust} = useTimer();
  if (!running) return null;
  const m = Math.floor(seconds / 60).toString().padStart(2,"0");
  const s = (seconds % 60).toString().padStart(2,"0");
  const warn = seconds <= 10;

  if (collapsed) {
    return (
      <div className={`timer-fab ${warn?"warn":""}`} onClick={()=>setCollapsed(false)}>
        <span style={{fontSize:18}}>⏱</span>
        <span className="t-time">{m}:{s}</span>
      </div>
    );
  }
  return (
    <div className={`timer-expanded ${warn?"warn":""}`}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:11,fontWeight:700,letterSpacing:1,color:"#9aa6bd",textTransform:"uppercase"}}>{label || "Recupero"}</span>
        <button onClick={()=>setCollapsed(true)} className="t-btn" style={{width:30,height:30,borderRadius:"50%",background:"rgba(0,0,0,.25)",color:"#fff"}}>—</button>
      </div>
      <div className="t-big">{m}:{s}</div>
      <div className="t-row">
        <button onClick={()=>adjust(-15)}>−15s</button>
        <button onClick={()=>adjust(15)}>+15s</button>
        <button onClick={stop} className="primary">Salta</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LOGICA PESO SUGGERITO (Double Progression Helms/Israetel)
// ═══════════════════════════════════════════════════════════════════

function getSuggestedWeight(exerciseKey, week, day, history) {
  const block = WEEK_BLOCK[week];
  const histKey = exerciseKey;
  const hist = (history && history[histKey]) || [];
  
  if (hist.length === 0) return null; // primo allenamento, nessun suggerimento
  
  // Prendi ultima session
  const last = hist[hist.length - 1];
  const lastWeek = last.week;
  const lastBlock = WEEK_BLOCK[lastWeek];
  const lastWeight = last.bestWeight;
  const lastReps = last.bestReps;
  const lastTopReps = BLOCK_PARAMS[lastBlock].repsMax;
  
  // Stessa settimana stesso blocco?
  if (block === lastBlock) {
    // Se ultima volta hai fatto top range, +2.5kg compound, +1kg accessori
    if (lastReps >= lastTopReps) {
      return Math.round((lastWeight + 2.5)*2)/2; // +2.5kg
    }
    return lastWeight;
  }
  
  // Nuovo blocco: cambia logica
  if (block === "BlockB" && lastBlock === "BlockA") {
    // Da 8-10 a 6-8: aumenta +5%
    return Math.round((lastWeight * 1.05)*2)/2;
  }
  if (block === "BlockC" && lastBlock === "BlockB") {
    // Da 6-8 a 4-6: aumenta +5-7%
    return Math.round((lastWeight * 1.06)*2)/2;
  }
  if (block === "BlockA" && (lastBlock === "BlockB" || lastBlock === "BlockC")) {
    // Reset blocco A: -5% rispetto Block B
    return Math.round((lastWeight * 0.95)*2)/2;
  }
  return lastWeight;
}

function epley1RM(weight, reps) {
  if (!weight || !reps) return 0;
  return Math.round(weight * (1 + reps/30));
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: EXERCISE DETAIL
// New design Hevy-style: peso bloccato in alto, ✓ ripetizione = parte timer
// ═══════════════════════════════════════════════════════════════════

function ExerciseDetailScreen({week, day, exerciseKey, idx, onBack}) {
  const exData = EX[exerciseKey];
  const dayProgram = PROGRAM_DAYS[day];
  const exMeta = dayProgram.exercises[idx];
  const block = WEEK_BLOCK[week];
  const params = BLOCK_PARAMS[block];
  const timer = useTimer();
  const {showToast} = useToast();
  
  // Compound vs accessorio per scegliere recupero
  const compoundKeys = ["squat","stacco","panca_inclinata_db","rematore_bb","pullup","shoulder_press_db","rdl","leg_press","dip"];
  const isCompound = compoundKeys.includes(exerciseKey);
  const restSec = isCompound ? params.rest : params.restAcc;
  
  const [logs, setLogs] = useState(() => storage.get(`log_w${week}_${day}`, {}));
  const [tab, setTab] = useState("set"); // "set" | "esecuzione"
  const log = logs[exerciseKey] || {load:null, sets:Array.from({length:params.sets},()=>({reps:null, done:false}))};
  
  // Inizializza set se mancano
  useEffect(() => {
    if (!log.sets || log.sets.length !== params.sets) {
      const newSets = Array.from({length: params.sets}, (_,i) => log.sets?.[i] || {reps:null, done:false});
      saveLog({...log, sets: newSets});
    }
  }, []);

  const history = storage.get("history", {});
  const suggested = getSuggestedWeight(exerciseKey, week, day, history);
  const lastHist = history[exerciseKey]?.slice(-1)[0];

  const saveLog = (newLog) => {
    const newLogs = {...logs, [exerciseKey]: newLog};
    setLogs(newLogs);
    storage.set(`log_w${week}_${day}`, newLogs);
  };

  const setLoad = (val) => {
    saveLog({...log, load: val ? parseFloat(val) : null});
  };

  const setReps = (i, val) => {
    const sets = [...log.sets];
    sets[i] = {...sets[i], reps: val ? parseInt(val,10) : null};
    saveLog({...log, sets});
  };

  const toggleDone = (i) => {
    if (!log.load) {
      showToast("⚠️ Imposta il peso prima");
      return;
    }
    const sets = [...log.sets];
    const wasDone = sets[i].done;
    
    // Se reps non impostate, usa target medio
    if (!sets[i].reps && !wasDone) {
      const target = Math.round((params.repsMin + params.repsMax) / 2);
      sets[i] = {...sets[i], reps: target};
    }
    
    sets[i] = {...sets[i], done: !wasDone};
    saveLog({...log, sets});
    
    // Se appena spuntato → parti timer
    if (!wasDone) {
      timer.start(restSec, exData.n);
      try { if(navigator.vibrate) navigator.vibrate(40); } catch {}
      
      // Se è l'ultimo set fatto, salva nella storia
      const allDone = sets.every(s => s.done);
      if (allDone) {
        const bestSet = sets.reduce((a,b) => (b.reps||0) > (a.reps||0) ? b : a, sets[0]);
        const histList = history[exerciseKey] || [];
        const newHist = [...histList, {
          week, day, date: Date.now(),
          load: log.load,
          sets: sets.map(s=>({reps:s.reps, done:s.done})),
          bestWeight: log.load,
          bestReps: bestSet.reps || 0,
          oneRM: epley1RM(log.load, bestSet.reps || 0)
        }];
        // Aggiorna solo se ultima entry è di altra settimana/data
        const updateHist = {...history, [exerciseKey]: newHist};
        storage.set("history", updateHist);
        showToast("✅ Esercizio completato");
      }
    }
  };

  const completed = log.sets ? log.sets.filter(s=>s.done).length : 0;
  const total = params.sets;

  return (
    <div className="fadeIn">
      <div className="topbar">
        <button onClick={onBack} className="icon-btn">←</button>
        <h1 style={{fontSize:15}}>{exData.n}</h1>
        <span style={{fontSize:11,fontWeight:700,color:"#9aa6bd"}}>{completed}/{total}</span>
      </div>

      {/* Hero immagine */}
      <div style={{padding:"4px 12px 8px"}}>
        <div style={{background:"#fff",borderRadius:14,height:200,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
          <img src={exData.img} alt={exData.n} style={{height:"100%",width:"auto",objectFit:"contain"}}/>
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",margin:"10px 0 6px"}}>
          <span className={`tech-badge ${TECNICHE[block].cls}`}>{TECNICHE[block].short} · {params.reps}</span>
          {exMeta.rotation && <span className="tech-badge tech-amrap">{exMeta.rotation}</span>}
          {exMeta.techniques && exMeta.techniques.map(t=><TechBadge key={t} k={t}/>)}
        </div>
        <div style={{fontSize:12.5,color:"#7d8aa3"}}>{exData.muscle}</div>
      </div>

      {/* Tab interno */}
      <div style={{display:"flex",gap:4,padding:"4px",margin:"0 12px 8px",background:"rgba(255,255,255,.04)",borderRadius:12}}>
        <button className={`day-tab ${tab==="set"?"active":""}`} onClick={()=>setTab("set")}>SERIE</button>
        <button className={`day-tab ${tab==="esecuzione"?"active":""}`} onClick={()=>setTab("esecuzione")}>ESECUZIONE</button>
      </div>

      {tab==="set" ? (
        <>
          {/* Peso lock - una volta per tutte */}
          <div className="load-lock">
            <label>Peso</label>
            <input type="number" inputMode="decimal" step="0.5" placeholder={suggested ? `${suggested}` : "kg"}
              value={log.load || ""} onChange={e=>setLoad(e.target.value)}/>
            <span className="unit">kg</span>
          </div>
          {!log.load && suggested && (
            <div style={{padding:"0 12px 8px",fontSize:11.5,color:"#9aa6bd",textAlign:"center"}}>
              💡 Suggerito {suggested}kg basato su sessione precedente {lastHist?`(sett.${lastHist.week})`:""}
            </div>
          )}
          {lastHist && (
            <div style={{padding:"0 12px 8px",fontSize:11,color:"#7d8aa3",textAlign:"center"}}>
              Sett. {lastHist.week}: {lastHist.bestWeight}kg × {lastHist.bestReps} reps · 1RM ~{lastHist.oneRM}kg
            </div>
          )}

          {/* Set list Hevy-style */}
          <div style={{padding:"0 12px"}}>
            <div style={{display:"grid",gridTemplateColumns:"48px 1fr 90px 90px 48px",padding:"4px 8px",fontSize:9.5,color:"#7d8aa3",textTransform:"uppercase",letterSpacing:.5,fontWeight:700}}>
              <span style={{textAlign:"center"}}>SET</span>
              <span style={{textAlign:"center"}}>PRECED.</span>
              <span style={{textAlign:"center"}}>OBIETTIVO</span>
              <span style={{textAlign:"center"}}>REPS</span>
              <span></span>
            </div>
            {(log.sets||[]).map((s, i) => {
              const isAmrap = params.amrapLast && i === total-1;
              const targetReps = isAmrap ? "AMRAP" : params.reps;
              const prevSet = lastHist?.sets?.[i];
              return (
                <div key={i} className={`set-row ${s.done?"completed":""}`}>
                  <span className="set-num">{i+1}</span>
                  <span className="set-prev">{prevSet ? `${lastHist.bestWeight}×${prevSet.reps||"?"}` : "-"}</span>
                  <span className="set-target">{targetReps}</span>
                  <input type="number" inputMode="numeric" placeholder="-"
                    value={s.reps || ""} onChange={e=>setReps(i, e.target.value)}
                    style={{padding:"6px 4px",textAlign:"center",fontWeight:700,fontSize:15,background:s.done?"rgba(80,200,140,.10)":"rgba(255,255,255,.05)",border:s.done?"1px solid rgba(80,200,140,.20)":"1px solid rgba(255,255,255,.10)"}}/>
                  <button className={`set-check ${s.done?"done":""}`} onClick={()=>toggleDone(i)}>
                    {s.done ? <span style={{color:"#fff",fontSize:18}}>✓</span> : <span style={{color:"#7d8aa3",fontSize:18}}>○</span>}
                  </button>
                </div>
              );
            })}
          </div>

          <div style={{padding:"14px 12px 100px",textAlign:"center",fontSize:11,color:"#7d8aa3"}}>
            ⏱ Spunta una serie → parte timer ({Math.floor(restSec/60)}min{restSec%60?` ${restSec%60}s`:""})
          </div>
        </>
      ) : (
        <div style={{padding:"0 14px 100px"}}>
          <div className="cue-box">
            <span className="ico">💡</span>
            <p>{exData.cue}</p>
          </div>
          <h3 style={{fontSize:13,fontWeight:700,color:"#9aa6bd",textTransform:"uppercase",letterSpacing:1,margin:"4px 0 0"}}>Passo per passo</h3>
          <ol className="steps-list">
            {exData.steps.map((s,i)=><li key={i}>{s}</li>)}
          </ol>
        </div>
      )}
    </div>
  );
}

      <div style={{padding:"6px 12px 12px"}}>
        <div className="glass" style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:"#9aa6bd",textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>Atleta</div>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:3}}>
            <span style={{fontSize:24,fontWeight:800}}>{ATHLETE_WEIGHT}kg</span>
            <span style={{fontSize:13,color:"#9aa6bd"}}>· Cutting · IF 16:8</span>
          </div>
        </div>
      </div>

      <div className="section-h">SETTIMANA</div>
      <div className="week-pills">
        {Array.from({length:PROGRAM_WEEKS},(_,i)=>i+1).map(w => {
          const wb = WEEK_BLOCK[w];
          return (
            <button key={w} className={`week-pill ${w===week?"active":""}`} onClick={()=>setWeek(w)}>
              {w}<span className="blk">{TECNICHE[wb].short}</span>
            </button>
          );
        })}
      </div>

      <div style={{padding:"0 12px",margin:"6px 0 14px"}}>
        <div className="glass" style={{padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
              <span className={`tech-badge ${TECNICHE[block].cls}`} onClick={(e)=>e.stopPropagation()}>{TECNICHE[block].short}</span>
              <span style={{fontSize:13,fontWeight:700}}>{params.name}</span>
            </div>
            <div style={{fontSize:11,color:"#9aa6bd"}}>{params.sets} set · {params.reps} reps</div>
          </div>
          <button onClick={onShowDashboard} style={{padding:"8px 14px",background:"rgba(64,164,255,.16)",borderRadius:10,fontSize:12,fontWeight:700,color:"#7fd9ff",border:"1px solid rgba(64,164,255,.30)"}}>📊 Stats</button>
        </div>
      </div>

      <div className="section-h">GIORNI</div>
      <div style={{padding:"0 12px"}}>
        {DAYS.map(d => {
          const dp = PROGRAM_DAYS[d.id];
          const log = storage.get(`log_w${week}_${d.id}`, {});
          const totEx = dp.exercises.length;
          const completed = Object.values(log).filter(l => (l.sets||[]).every(s => s.done)).length;
          const isToday = d.id === todayDayId;
          return (
            <button key={d.id} onClick={()=>onSelectDay(d.id)}
              className="exercise-hero" style={{cursor:"pointer",borderColor: isToday?dp.color+"55":"rgba(255,255,255,.07)",background: isToday?dp.color+"08":"rgba(255,255,255,.04)"}}>
              <div style={{width:50,height:50,borderRadius:12,background:dp.color+"22",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontWeight:800,color:dp.color,fontSize:14,letterSpacing:.5}}>
                {d.label}
              </div>
              <div className="exercise-meta">
                <h3 style={{color:isToday?dp.color:"#e8eef5"}}>{dp.title}{isToday && <span style={{fontSize:10,marginLeft:8,padding:"2px 8px",background:dp.color+"22",borderRadius:999,color:dp.color,fontWeight:700,letterSpacing:.5,verticalAlign:"middle"}}>OGGI</span>}</h3>
                <div className="muscles">{dp.desc}</div>
                <div style={{fontSize:11,color:"#9aa6bd",fontWeight:600}}>{totEx} esercizi · {completed===totEx?"✅ Completato":`${completed}/${totEx}`}</div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: DASHBOARD (statistiche)
// ═══════════════════════════════════════════════════════════════════

function DashboardScreen({onBack}) {
  const history = storage.get("history", {});
  const allEntries = Object.entries(history).flatMap(([k, list]) => list.map(h => ({...h, exercise: k})));
  
  const total1RM = allEntries.length > 0 ? Math.round(allEntries.reduce((s,e)=>s+e.oneRM,0) / allEntries.length) : 0;
  const totalSessions = new Set(allEntries.map(e => `${e.week}_${e.day}`)).size;
  const totalSets = allEntries.reduce((s,e) => s + (e.sets?.filter(x=>x.done).length || 0), 0);
  const totalReps = allEntries.reduce((s,e) => s + (e.sets?.reduce((sx,x)=>sx+(x.reps||0),0) || 0), 0);
  const totalVolume = allEntries.reduce((s,e) => s + (e.sets?.reduce((sx,x)=>sx+(x.reps||0)*(e.bestWeight||0),0) || 0), 0);

  // Top 1RM stimati per compound
  const compoundList = ["squat","stacco","panca_inclinata_db","rematore_bb","pullup"];
  const topLifts = compoundList.map(k => {
    const list = history[k] || [];
    const best = list.reduce((b,e) => e.oneRM > (b?.oneRM||0) ? e : b, null);
    return best ? {key:k, ...best, exName: EX[k].n} : null;
  }).filter(Boolean);

  return (
    <div className="fadeIn">
      <div className="topbar">
        <button onClick={onBack} className="icon-btn">←</button>
        <h1>Statistiche</h1>
      </div>
      
      <div className="kpi-grid" style={{marginTop:8}}>
        <div className="kpi"><div className="lbl">Sessioni</div><div className="val">{totalSessions}</div></div>
        <div className="kpi"><div className="lbl">Set totali</div><div className="val">{totalSets}</div></div>
        <div className="kpi"><div className="lbl">Reps totali</div><div className="val">{totalReps}</div></div>
        <div className="kpi"><div className="lbl">Volume tot.</div><div className="val">{Math.round(totalVolume/1000)}<span style={{fontSize:14}}>k kg</span></div></div>
      </div>

      <div className="section-h">🏆 1RM STIMATI (compound)</div>
      <div style={{padding:"0 12px"}}>
        {topLifts.length === 0 ? (
          <div className="empty-state"><div className="ico">📊</div>Nessun dato ancora. Completa qualche serie!</div>
        ) : topLifts.map(t => (
          <div key={t.key} className="glass" style={{padding:"12px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:12}}>
            <img src={EX[t.key].img} alt={t.exName} style={{width:50,height:50,borderRadius:10,background:"#fff",objectFit:"contain"}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700}}>{t.exName}</div>
              <div style={{fontSize:11,color:"#9aa6bd",marginTop:2}}>Best: {t.bestWeight}kg × {t.bestReps} reps · sett. {t.week}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:22,fontWeight:800,color:"#7fe2b0"}}>{t.oneRM}<span style={{fontSize:11,color:"#7d8aa3"}}>kg</span></div>
              <div style={{fontSize:10,color:"#7d8aa3"}}>1RM stim.</div>
            </div>
          </div>
        ))}
      </div>

      <div className="section-h">⚙️ DATI</div>
      <div style={{padding:"0 12px"}}>
        <button className="btn-secondary" style={{marginBottom:8}} onClick={()=>{
          const data = {
            history: storage.get("history",{}),
            currentWeek: storage.get("currentWeek",1),
            logs: {}
          };
          for (let w=1; w<=PROGRAM_WEEKS; w++) {
            for (const d of DAYS) {
              const k = `log_w${w}_${d.id}`;
              const v = storage.get(k);
              if (v) data.logs[k] = v;
            }
          }
          const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = `v8tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
          a.click(); URL.revokeObjectURL(url);
        }}>📥 Esporta backup JSON</button>

        <label className="btn-secondary" style={{marginBottom:8,display:"block",cursor:"pointer"}}>
          📤 Importa backup JSON
          <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
              try {
                const d = JSON.parse(r.result);
                if (d.history) storage.set("history", d.history);
                if (d.currentWeek) storage.set("currentWeek", d.currentWeek);
                if (d.logs) Object.entries(d.logs).forEach(([k,v])=>storage.set(k.replace(KEY_PREFIX,""), v));
                alert("✅ Backup importato. Ricarico la pagina.");
                window.location.reload();
              } catch (err) { alert("❌ File non valido"); }
            };
            r.readAsText(f);
          }}/>
        </label>

        <button className="btn-danger" onClick={()=>{
          if (confirm("Cancellare TUTTI i dati? (storia, settimane, log)")) {
            const keys = Object.keys(localStorage).filter(k=>k.startsWith(KEY_PREFIX));
            keys.forEach(k => localStorage.removeItem(k));
            window.location.reload();
          }
        }}>🗑 Reset completo</button>
      </div>

      <div style={{height:80}}></div>
    </div>
  );
}

              <span className={`tech-badge ${t.cls}`} style={{fontSize:11,flexShrink:0}}>{t.short}</span>

              </div>
              <span style={{color:"#7d8aa3"}}>›</span>
            </button>
          );
        })}
      </div>
    </div>
  );

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════

function App() {
  const [screen, setScreen] = useState({type:"home"});
  
  return (
    <ToastProvider>
      <TimerProvider>
        <TechModalProvider>
          <FloatingTimer/>
          {screen.type === "home" && (
            <HomeScreen 
              onSelectDay={(d) => {
                const w = storage.get("currentWeek", 1);
                setScreen({type:"workout", week:w, day:d});
              }}
              onShowDashboard={() => setScreen({type:"dashboard"})}
              onShowGuide={() => setScreen({type:"guide"})}
            />
          )}
          {screen.type === "workout" && (
            <WorkoutScreen 
              week={screen.week} 
              day={screen.day}
              onBack={() => setScreen({type:"home"})}
              onOpenExercise={(k, idx) => setScreen({type:"exercise", week:screen.week, day:screen.day, exerciseKey:k, idx})}
            />
          )}
          {screen.type === "exercise" && (
            <ExerciseDetailScreen 
              week={screen.week} 
              day={screen.day}
              exerciseKey={screen.exerciseKey}
              idx={screen.idx}
              onBack={() => setScreen({type:"workout", week:screen.week, day:screen.day})}
            />
          )}
          {screen.type === "dashboard" && (
            <DashboardScreen onBack={() => setScreen({type:"home"})}/>
          )}
          {screen.type === "guide" && (
            <GuideScreen onBack={() => setScreen({type:"home"})}/>
          )}
        </TechModalProvider>
      </TimerProvider>
    </ToastProvider>
  );
}

// Mount
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

// Service Worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
